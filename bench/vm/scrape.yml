# VictoriaMetrics single-node scrape configuration for the bench stand.
# Every worker replica is discovered through Docker DNS (the service name
# resolves to all replica IPs), so `up{job="worker"}` has one series per
# live replica. bench-verify metrics compares that count with WORKERS.
#
# VictoriaMetrics does not accept refresh_interval inside dns_sd_configs
# (the stand failed to start with it); the DNS re-resolution period is set
# globally by -promscrape.dnsSDCheckInterval in bench/compose.bench.yml.
global:
  scrape_interval: 5s
  scrape_timeout: 4s

scrape_configs:
  - job_name: api
    static_configs:
      - targets: ["backend:9100"]

  - job_name: outbox
    dns_sd_configs:
      - names: ["outbox"]
        type: A
        port: 9100

  - job_name: worker
    dns_sd_configs:
      - names: ["worker"]
        type: A
        port: 9100

  - job_name: sampler
    static_configs:
      - targets: ["sampler:9200"]

  # Redpanda public metrics (consumer group offsets, partition max offsets).
  # Lag = redpanda_kafka_max_offset - redpanda_kafka_consumer_group_committed_offset.
  - job_name: redpanda
    metrics_path: /public_metrics
    static_configs:
      - targets: ["redpanda:9644"]

  - job_name: victoriametrics
    static_configs:
      - targets: ["localhost:8428"]
