services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: avito
      POSTGRES_PASSWORD: avito_password
      POSTGRES_DB: avito_recap
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/migrations/001_postgres_init.sql:/docker-entrypoint-initdb.d/001_postgres_init.sql:ro
      - ./backend/migrations/002_seed_data.sql:/docker-entrypoint-initdb.d/002_seed_data.sql:ro
      - ./backend/migrations/003_recap_requests.sql:/docker-entrypoint-initdb.d/003_recap_requests.sql:ro
      - ./backend/migrations/004_eventing.sql:/docker-entrypoint-initdb.d/004_eventing.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U avito -d avito_recap"]
      interval: 5s
      timeout: 5s
      retries: 10

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    container_name: avito-recap-clickhouse
    environment:
      CLICKHOUSE_DB: recap
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ""
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./backend/migrations/clickhouse:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:${REDPANDA_VERSION:-v26.2.2}
    command:
      - redpanda
      - start
      - --kafka-addr
      - internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr
      - internal://redpanda:9092,external://localhost:19092
      - --pandaproxy-addr
      - internal://0.0.0.0:8082,external://0.0.0.0:18082
      - --advertise-pandaproxy-addr
      - internal://redpanda:8082,external://localhost:18082
      - --rpc-addr
      - redpanda:33145
      - --advertise-rpc-addr
      - redpanda:33145
      - --mode
      - dev-container
      - --smp
      - "1"
      - --default-log-level=info
    ports:
      - "19092:19092"
      - "18082:18082"
      - "19644:9644"
    volumes:
      - redpanda_data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD", "rpk", "cluster", "info"]
      interval: 10s
      timeout: 15s
      retries: 10
      start_period: 10s

  redpanda-init:
    image: docker.redpanda.com/redpandadata/redpanda:${REDPANDA_VERSION:-v26.2.2}
    depends_on:
      redpanda:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-ec"]
    command: |
      rpk topic create --if-not-exists --brokers redpanda:9092 --partitions 3 --replicas 1 \
        recap.generation-commands.v1 recap.lifecycle.v1 recap.generation-commands.dlq.v1
    restart: "no"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["/app/server"]
    container_name: avito-recap-backend
    env_file:
      - ./backend/.env.example
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: avito
      DB_PASSWORD: avito_password
      DB_NAME: avito_recap
      DB_SSLMODE: disable
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_DATABASE: recap
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ""
      SERVER_PORT: 8080
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      SSE_POLL_INTERVAL: 250ms
      SSE_HEARTBEAT_INTERVAL: 10s
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/api/v1/profiles"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: on-failure

  outbox:
    init: true
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["/app/outbox"]
    env_file:
      - ./backend/.env.example
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: avito
      DB_PASSWORD: avito_password
      DB_NAME: avito_recap
      DB_SSLMODE: disable
      REDPANDA_HTTP_URL: http://redpanda:8082
      OUTBOX_POLL_INTERVAL: 250ms
      OUTBOX_LEASE_DURATION: 15s
      OUTBOX_BATCH_SIZE: 50
    depends_on:
      postgres:
        condition: service_healthy
      redpanda-init:
        condition: service_completed_successfully
    restart: unless-stopped

  worker:
    init: true
    stop_grace_period: 20s
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["/app/worker"]
    env_file:
      - ./backend/.env.example
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: avito
      DB_PASSWORD: avito_password
      DB_NAME: avito_recap
      DB_SSLMODE: disable
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_DATABASE: recap
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ""
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      REDPANDA_HTTP_URL: http://redpanda:8082
      REDPANDA_COMMAND_TOPIC: recap.generation-commands.v1
      REDPANDA_LIFECYCLE_TOPIC: recap.lifecycle.v1
      REDPANDA_DLQ_TOPIC: recap.generation-commands.dlq.v1
      REDPANDA_CONSUMER_GROUP: recap-workers-v1
      WORKER_COMMAND_SOURCE: ${WORKER_COMMAND_SOURCE:-hybrid}
      WORKER_POLL_INTERVAL: ${WORKER_POLL_INTERVAL:-500ms}
      WORKER_LEASE_DURATION: 30s
      WORKER_HEARTBEAT_INTERVAL: 10s
      WORKER_RETRY_BASE: 2s
      WORKER_RETRY_MAX: 30s
      WORKER_MAX_ATTEMPTS: 3
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      redpanda-init:
        condition: service_completed_successfully
      outbox:
        condition: service_started
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: avito-recap-frontend
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: on-failure

volumes:
  postgres_data:
  clickhouse_data:
  redpanda_data:
